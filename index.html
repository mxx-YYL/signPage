<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">

<title>vane 签字</title>
<!-- vane 的签名：签字人的 passkey（WebAuthn，memo D-187 / D-188）。这一页由签字人电脑上的本机小服务（setup.bat / setup.sh 装一次，开机自己起）在
     http://localhost:8765/ 发，只做三件事：登记这台电脑的 passkey（带设备的硬件证明）、把会话链接里带来的东西原样摆出来让人读了再签（一次签完一批）、
     验过根签字人签的发布单后把自己换成新版。没有任何秘密：私钥在设备里，这一页拿不到。算法与 software/src/vane/passkey.py 逐字相同：
       一件 challenge = sha256("vane-passkey-v1\n" + 命名空间 + "\n" + 文件的 sha256 十六进制)
       一批 challenge = sha256("vane-passkey-v1\nbatch\n" + 每件一行「命名空间 sha256」)
       登记 challenge = sha256("vane-passkey-v1\nvane-signer-self\n" + 名字 + "\n" + nonce)
     2.10.0 起还做第四件：setup 链接（`vane sign setup-link`）—— 人输一次密码，这台设备逐个名字新设 passkey，这一页用人的密码对每一份登记记录签担保。
     2.12.0 起界面整个重画（用户 2026-11-06「對vane的簽字頁面改版，ui 全面重新設計，另外主動智能勾選建議項目」）：签法、签的字节、给出的 JSON 一样不变；
     批准件每件一个勾（默认勾上，去掉的这次不签、留着下次）；单选按线归拢，每一问都预先选好建议项、写明为什么；签完自动复制那段 JSON。
     同一份字节也是云端签字页 https://mxx-yyl.github.io/signPage/（memo D-252）。 -->
<style>
:root{
  --bg:#f5f3ee;--bg-top:#ebe9e1;--surface:#fffefb;--surface-2:#f7f5ef;--fg:#1c1b18;--fg-2:#3f3d37;--muted:#6e6b62;--faint:#a29e93;
  --line:#e5e1d6;--line-2:#d4cfc2;
  --accent:#1f6d48;--accent-hi:#185a3b;--on-accent:#fff;--accent-soft:#e5f1e9;--accent-line:#b7d6c3;
  --sugg:#6a4fb0;--sugg-soft:#f1ecfb;--sugg-line:#d9cdf2;
  --warn:#8d5b00;--warn-soft:#fbf2df;--warn-line:#ecd6a6;
  --bad:#a63d3a;--bad-soft:#f9e6e4;--bad-line:#ebc0bb;
  --info:#2d5b88;--info-soft:#e7eef7;--info-line:#c2d4e8;
  --shadow:0 1px 1px rgba(40,32,10,.04),0 6px 20px -10px rgba(40,32,10,.16);
  --r:16px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121311;--bg-top:#1a1b18;--surface:#1c1d1a;--surface-2:#23241f;--fg:#ecebe6;--fg-2:#cfcdc6;--muted:#a19e95;--faint:#77746c;
  --line:#2f312c;--line-2:#3d3f39;
  --accent:#48b57d;--accent-hi:#5cc790;--on-accent:#06170e;--accent-soft:#15291e;--accent-line:#2b5a40;
  --sugg:#b7a2f2;--sugg-soft:#231d35;--sugg-line:#45396b;
  --warn:#e2b055;--warn-soft:#2a2213;--warn-line:#5a4621;
  --bad:#ee8f88;--bad-soft:#301b19;--bad-line:#65332f;
  --info:#90badf;--info-soft:#16212d;--info-line:#2e4761;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.6);
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg) linear-gradient(var(--bg-top),var(--bg) 340px) no-repeat;color:var(--fg);font:15px/1.62 var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.shell{max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.mono{font-family:var(--mono);font-size:.88em;word-break:break-all}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:6px 0 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:10px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand-alt{font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:0 8px;line-height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;color:var(--fg-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:14px;height:14px;flex:none;color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.chip.ok .dot{background:var(--accent)}.chip.warn .dot{background:var(--warn)}
.chip.ok svg{color:var(--accent)}
.hero{padding:22px 2px 2px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.hero h1{font-size:28px;line-height:1.22;letter-spacing:-.015em;margin:6px 0 8px;font-weight:750}
.hero h1 .n{color:var(--accent)}
.lede{margin:0;color:var(--fg-2);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.stat b{font-size:15px;color:var(--fg)}
.stat svg{width:15px;height:15px;color:var(--muted)}
.stat.sugg{background:var(--sugg-soft);border-color:var(--sugg-line);color:var(--sugg)}
.stat.sugg b,.stat.sugg svg{color:var(--sugg)}
.stat.need{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.stat.need b{color:var(--warn)}
.block{margin:24px 0 0}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin:0 2px 4px}
.block-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.block-hint{margin:0 2px 10px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:6px}
.linkbtn:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.linkbtn:disabled{color:var(--faint);cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-top:14px}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.4}
.card>p{margin:6px 0 0}
details.card>summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-weight:650}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary svg{width:16px;height:16px;color:var(--muted);transition:transform .15s}
details.card[open]>summary svg{transform:rotate(90deg)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px 12px;box-shadow:var(--shadow);transition:border-color .15s,background-color .15s}
.item.on{border-color:var(--accent-line)}
.item.off{background:var(--surface-2);box-shadow:none}
.item.off .ask,.item.off .meta,.item.off .enroll{opacity:.55}
.cb{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line-2);background:var(--surface);
  display:grid;place-content:center;cursor:pointer;transition:background-color .12s,border-color .12s}
.cb::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 2.6px 2.6px 0;transform:translateY(-1px) rotate(45deg)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{border-color:var(--on-accent)}
.cb:disabled{cursor:default;opacity:.75}
.item-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.num{font:600 11.5px/20px var(--mono);color:var(--muted);min-width:16px}
.tag{font-size:12px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;border:1px solid}
.badge.ok{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.badge.info{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.ask{display:block;font-size:16px;font-weight:650;line-height:1.45;cursor:pointer;margin:4px 0 4px;word-break:break-word}
.meta{color:var(--muted);font-size:12px;line-height:1.5}
.enroll{margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn-line);font-size:14px}
.enroll p{margin:4px 0 0;font-size:13px;color:var(--fg-2)}
details.raw{margin-top:6px}
details.raw>summary{display:inline-flex;align-items:center;gap:4px;cursor:pointer;list-style:none;color:var(--muted);font-size:13px;padding:2px 0;border-radius:6px}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>summary svg{width:14px;height:14px;transition:transform .15s}
details.raw[open]>summary svg{transform:rotate(90deg)}
details.raw>summary:hover{color:var(--fg)}
pre.doc{white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto;margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);font:12.5px/1.55 var(--mono);color:var(--fg-2)}
.rawopt{margin-top:10px}
.lines{display:grid;gap:12px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.line-head{display:flex;align-items:baseline;justify-content:space-between;gap:2px 12px;flex-wrap:wrap;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.line-name{font:700 14.5px/1.4 var(--mono);word-break:break-all}
.line-ctx{font-size:12.5px;color:var(--muted)}
.q{padding:14px 18px}
.q+.q{border-top:1px dashed var(--line)}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.q-title{font-weight:650;font-size:14.5px}
.sugg{display:inline-flex;align-items:flex-start;gap:6px;max-width:100%;font-size:12.5px;color:var(--sugg);background:var(--sugg-soft);border:1px solid var(--sugg-line);
  border-radius:12px;padding:1px 10px;line-height:20px}
.sugg>span{min-width:0}
.sugg svg{width:12px;height:12px;flex:none;margin-top:4px}
.sugg.changed{color:var(--fg-2);background:var(--surface-2);border-color:var(--line)}
.sugg.need{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.sugg .linkbtn{font-size:12.5px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.opt{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 15px;border-radius:999px;border:1.5px solid var(--line-2);
  background:var(--surface);cursor:pointer;font-size:14px;line-height:1.3;user-select:none;-webkit-user-select:none;transition:border-color .12s,background-color .12s}
.opt:hover{border-color:var(--faint)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt .tick{display:none;width:15px;height:15px;flex:none;color:var(--accent)}
.opt .sp{width:11px;height:11px;flex:none;color:var(--sugg)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:650}
.opt.sel .tick{display:inline-block}
.opt.focus{outline:2px solid var(--accent);outline-offset:2px}
.opt.locked{cursor:default}
.opt.locked:not(.sel){opacity:.5}
.q-desc{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
.prop{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--info-soft);border:1px solid var(--info-line);
  font-size:13px;color:var(--fg-2)}
.prop svg{width:15px;height:15px;color:var(--info);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;
  line-height:1.3;cursor:pointer;text-align:center;transition:background-color .12s,border-color .12s,transform .06s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 22px -14px var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hi)}
.btn.big{width:100%;min-height:54px;font-size:16.5px;border-radius:14px}
.btn.big svg{width:20px;height:20px}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn.ghost:hover:not(:disabled){border-color:var(--faint)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.small svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actionbar{position:sticky;bottom:0;z-index:5;margin:24px -16px 0;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .actionbar{background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}}
.actionbar.done{position:static;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.sumline{display:flex;align-items:baseline;justify-content:space-between;gap:2px 12px;flex-wrap:wrap;margin:0 2px 10px;font-size:13.5px;color:var(--fg-2)}
.sumline b{color:var(--fg)}
.okline{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:650}
.okline svg{width:16px;height:16px}
.sub{margin:7px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.45;text-align:center}
.note{margin:18px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.pwblock .input{margin-top:10px}
.notice{display:flex;align-items:flex-start;gap:10px;margin:12px 0;padding:12px 14px;border-radius:12px;border:1px solid;font-size:14px;line-height:1.55}
.notice>svg{width:18px;height:18px;flex:none;margin-top:2px}
.notice .nb{min-width:0;flex:1;word-break:break-word}
.notice .nb>b{display:block;margin-bottom:2px}
.notice .nb p{margin:4px 0 0}
.notice.ok{background:var(--accent-soft);border-color:var(--accent-line)}.notice.ok>svg{color:var(--accent)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn-line)}.notice.warn>svg{color:var(--warn)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad-line)}.notice.bad>svg{color:var(--bad)}
.notice.info{background:var(--info-soft);border-color:var(--info-line)}.notice.info>svg{color:var(--info)}
.notice .btnrow{margin-top:10px}
.spin{width:16px;height:16px;flex:none;margin-top:3px;border-radius:50%;border:2px solid var(--info-line);border-top-color:var(--info);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.outcomes{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.outcomes li{display:flex;gap:6px;align-items:flex-start}
.outcomes svg{width:15px;height:15px;flex:none;margin-top:4px}
.outcomes .ok svg{color:var(--accent)}.outcomes .bad svg{color:var(--bad)}
.results:empty{display:none}
.result{margin:16px 0 0;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--accent-line);box-shadow:var(--shadow)}
.result-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.badge-ic{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.badge-ic svg{width:22px;height:22px}
.result h2{margin:0;font-size:17px;line-height:1.4}
.result-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.copystate{margin:10px 2px 0;font-size:13.5px;color:var(--accent);font-weight:600}
.copystate:empty{display:none}
textarea.json{display:block;width:100%;min-height:120px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
  font:12px/1.45 var(--mono);color:var(--fg-2);resize:vertical}
.field{display:grid;gap:6px;margin:12px 0 0}
.field>span{font-size:13px;color:var(--muted)}
.input{width:100%;min-height:44px;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-size:15px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{opacity:.6}
.steps{display:flex;gap:8px;margin:16px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--mono);
  background:var(--surface-2);border:1px solid var(--line-2)}
.steps li.now{color:var(--fg);border-color:var(--accent-line);background:var(--accent-soft)}
.steps li.now::before{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps li.done::before{content:"✓";background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0}
.setrow+.setrow{border-top:1px dashed var(--line)}
.setrow .who{display:flex;align-items:center;gap:10px;font-weight:650;min-width:0;flex-wrap:wrap}
.pill{font-size:12px;line-height:20px;padding:0 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);font-weight:500}
.pill.ok{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.pill.busy{color:var(--info);border-color:var(--info-line);background:var(--info-soft)}
.status-row{display:flex;gap:12px;align-items:center}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.how div{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.how b{display:block;font-size:14px;color:var(--fg);margin-bottom:2px}
.foot{margin:28px 2px 0;padding:14px 0 calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;line-height:1.6}
@media (max-width:560px){
  body{font-size:14.5px}
  .hero{padding-top:14px}
  .hero h1{font-size:23px}
  .item{padding:12px 13px 10px;gap:4px 11px}
  .ask{font-size:15px}
  .q,.line-head{padding-left:14px;padding-right:14px}
  .card{padding:14px}

// ---------------------------------------------------------------- 签字页自己更新（setup once + auto update page）

// ---------------------------------------------------------------- 登记（每台电脑一次）
async function createPasskey(who) {                         // 这台设备新设一把 passkey -> 签字页「登记」那段 JSON（2.10.0 起 setup 也用它）
  if (!who) throw new Error("先写你的名字（GitHub 用户名或你在团队里的名字）");
  const nonce = hex(crypto.getRandomValues(new Uint8Array(16)));
  let cred;

    cred = await navigator.credentials.create({publicKey: {
      rp: {name: "vane", id: location.hostname},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: who, displayName: who + " (vane)"},

    credId: b64u(cred.rawId), alg: cred.response.getPublicKeyAlgorithm(), spki: b64(spki), fingerprint: hex(await sha256(spki)), nonce,

  if (pw !== again) throw new Error("两次输入的密码不一样");

// ---------------------------------------------------------------- 一次密码设 passkey（2.10.0，setup 链接；会话 `vane sign setup-link` 出）
// 链接带 setup = {who: [名字…], rec: {schema, namespaces, note}}（rec 是会话那一版 passkey.py 写登记记录用的那几样）与人的密码钥 pw（只有公钥与盐）。
// 人输一次密码 -> 对上 pw 里的一把才往下走；每个名字按一次（每次新设 passkey 都要人按一下：Safari 只认点出来的）；全设好（或「到这里就好」）
// -> 这一页用那把密码钥对每一份登记记录签担保（一批，vane-signer-enroll）-> 一段 JSON 贴回会话 `vane sign setup '<JSON>'`。
function cborFmt(u) {                                       // 设备证明（attestationObject，CBOR 表）里的 fmt —— 只读这一格，别的跳过
  let p = 0;
  const need = n => { if (p + n > u.length) throw new Error("设备证明读不动（CBOR 截断）"); };
  const head = () => {
    need(1); const b = u[p++], mt = b >> 5, ai = b & 31; let n = ai;
    if (ai === 24) { need(1); n = u[p++]; }
    else if (ai === 25) { need(2); n = u[p] * 256 + u[p + 1]; p += 2; }
    else if (ai === 26) { need(4); n = ((u[p] * 256 + u[p + 1]) * 256 + u[p + 2]) * 256 + u[p + 3]; p += 4; }
    else if (ai > 26) throw new Error("设备证明读不动（CBOR 长度）");
    return [mt, n];
  };
  const text = n => { need(n); const s = new TextDecoder().decode(u.subarray(p, p + n)); p += n; return s; };
  const skip = () => {
    const [mt, n] = head();
    if (mt === 2 || mt === 3) { need(n); p += n; }
    else if (mt === 4) for (let i = 0; i < n; i++) skip();
    else if (mt === 5) for (let i = 0; i < 2 * n; i++) skip();
    else if (mt === 6) skip();
  };
  const [mt, n] = head();
  if (mt !== 5) throw new Error("设备证明不是 CBOR 表");
  for (let i = 0; i < n; i++) {
    const [kt, kn] = head();
    const key = kt === 3 ? text(kn) : null;
    if (kt === 2) { need(kn); p += kn; } else if (kt >= 4 && kt <= 6) throw new Error("设备证明的键不认得");
    if (key === "fmt") { const [vt, vn] = head(); if (vt !== 3) throw new Error("设备证明的 fmt 不是文本"); return text(vn); }
    skip();
  }
  throw new Error("设备证明里没有 fmt");
}
// 登记记录的字节：与 passkey.py 的 enroll_record() 逐字相同 —— json.dumps(doc, ensure_ascii=False, indent=1) + "\n"，键的次序也一样
function recordText(reg, rec) {
  const signer = {principal: reg.principal, rpId: reg.rpId, origin: reg.origin, credId: reg.credId, alg: reg.alg, spki: reg.spki, page: reg.page,
                  fingerprint: reg.fingerprint, namespaces: rec.namespaces};
  const doc = {schema: rec.schema, signer, attestation: {fmt: cborFmt(unb64u(reg.attestationObject)), attestationObject: reg.attestationObject,
               clientDataJSON: reg.clientDataJSON, nonce: reg.nonce || ""}, note: rec.note};
  return JSON.stringify(doc, null, 1) + "\n";
}
const slugOf = who => [...String(who)].map(ch => /[\p{L}\p{N}_-]/u.test(ch) ? ch : "-").slice(0, 40).join("") || "signer";
async function pwMatch(pw, cands, where) {                  // 密码 -> 对得上指纹的那一把人的密码钥 {k（私钥只在这一页里）, c}
  if (!pw) throw new Error("先输密码");
  const note = busy("正在用密码算钥（scrypt，几秒钟）……", where);
  await tick();
  try {
    const cache = {};
    for (const c of cands) {
      const key = JSON.stringify(c.kdf);
      const k = cache[key] || (cache[key] = await pwKey(pw, c.kdf));
      if (k.fp === c.fingerprint) return {k, c};
    }
  } finally { note.remove(); }
  throw new Error("密码不对（对不上链接带来的人的密码钥）");
}
function setupFlow(setup, pwSigners) {
  const rec = setup && setup.rec;
  if (!rec || rec.schema !== "vane.passkey.enrollment.v1" || !Array.isArray(rec.namespaces) || typeof rec.note !== "string")
    return fail("setup 链接不完整（没带登记记录的格式）—— 请会话重出 `vane sign setup-link`");
  const cands = (pwSigners || []).filter(x => x && x.credId && x.kdf && x.fingerprint);
  if (!cands.length) return fail("setup 链接没带人的密码钥 —— 请会话重出 `vane sign setup-link`");
  const names0 = (Array.isArray(setup.who) ? setup.who : []).map(s => String(s).trim()).filter(Boolean);
  document.title = "设 passkey · vane 签字";
  const steps = h("ol", {class: "steps"}, h("li", {class: "now"}, "输一次密码"), h("li", {}, "逐个设 passkey"), h("li", {}, "贴回会话"));
  const setStep = k => [...steps.children].forEach((li, i) => { li.className = i < k ? "done" : i === k ? "now" : ""; });
  app.replaceChildren(hero("一次设好", "设这台设备的 passkey",
    "输一次密码，再逐个名字按一下：每个名字在这台设备上新设一把 passkey（iCloud 钥匙串 / Windows Hello / 安全钥都行）；全设好，这一页用你的密码一次担保它们。" +
    "密码只在这台设备的浏览器里算钥、签担保，不发给任何地方。把最后给的那段 JSON 贴回会话，这几把当场就是签字人，之后签字按指纹就行。"), steps);
  const who = h("input", {class: "input", autocomplete: "off", value: names0.join(", ")});
  const pin = h("input", {class: "input", type: "password", autocomplete: "current-password", placeholder: "vane 的密码"});
  const go = h("button", {class: "btn primary", type: "button"}, icon("lock"), h("span", {text: "验密码"}));
  const c = h("section", {class: "card"}, h("h3", {text: "① 输一次密码"}),
    h("label", {class: "field"}, h("span", {text: "要设的名字（逗号隔开，可以改）"}), who),
    h("p", {class: "muted"}, "担保用人的密码钥：", cands.map((x, i) => [i ? "、" : "", x.principal + "（钥 ", h("span", {class: "mono", text: String(x.fingerprint).slice(0, 16) + "…"}), "）"])),
    h("label", {class: "field"}, h("span", {text: "密码"}), pin), h("div", {class: "btnrow"}, go));
  app.append(c);
  const submit = async () => {
    if (go.disabled) return;
    go.disabled = true;
    try {
      const names = [...new Set(who.value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean))];
      if (!names.length) throw new Error("至少写一个名字");
      if (names.length > 8) throw new Error("一次最多设 8 把");
      const m = await pwMatch(pin.value, cands, c);
      c.querySelectorAll(".notice.bad").forEach(e => e.remove());   // 先前输错的那几行收掉
      pin.value = ""; pin.disabled = true; who.disabled = true;
      go.lastChild.textContent = "密码对了（" + m.c.principal + "）：下面逐个按";
      setStep(1);
      setupSteps(names, m, rec, setStep);
    } catch (e) { go.disabled = false; fail(e, c); }
  };
  go.onclick = submit;
  pin.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  reveal(c);
}
function setupSteps(names, m, rec, setStep) {
  const done = [];
  let finished = false;
  const card2 = h("section", {class: "card"}, h("h3", {text: "② 逐个设 passkey"}),
    h("p", {class: "muted", text: "每按一次，系统弹一次 Touch ID / Windows Hello / 安全钥（Safari 只认点出来的，所以一个一个按）。"}));
  const rows = names.map((n, i) => {
    const st = h("span", {class: "pill", text: "等着"});
    const b = h("button", {class: "btn primary small", type: "button"}, icon("key"), h("span", {text: "设 " + n + " 的 passkey"}));
    card2.append(h("div", {class: "setrow"}, h("div", {class: "who"}, h("span", {class: "num", text: String(i + 1)}), h("span", {text: n}), st), b));
    return {n, b, st};
  });
  const early = h("button", {class: "btn ghost", type: "button", disabled: true}, "到这里就好：担保已经设好的这几把");
  card2.append(h("div", {class: "btnrow"}, early));
  app.append(card2);
  reveal(card2);
  async function finish() {
    if (finished || !done.length) return;
    finished = true;
    rows.forEach(r => { if (r.b.isConnected) r.b.disabled = true; });
    early.remove();
    const items = done.map(d => ({ns: ENROLL_NS, sha: d.sha, file: d.file}));
    const msg = concat(enc.encode(PW_PREFIX + "\n"), await sha256(enc.encode(chalTextOf(items))));
    const sig = await crypto.subtle.sign({name: "Ed25519"}, m.k.priv, msg);
    m.k = null;                                            // 签完就不留这把钥
    const vouch = withItems({schema: "vane.passkey.assertion.v1", kind: "password", credId: m.c.credId, signature: b64u(sig), by: m.c.principal}, items);
    for (const d of done) await rememberMe(STATE, d.reg);
    chrome(STATE, done[done.length - 1].reg);
    setStep(2);
    out("设好了：把下面这段贴回会话（只这一次）", {schema: "vane.passkey.setup.v1", registrations: done.map(d => d.reg), vouch},
      "这里是 " + done.length + " 把 passkey 的公钥与设备证明（" + done.map(d => d.reg.principal + " 钥 " + d.reg.fingerprint.slice(0, 16) + "…").join("；") +
      "），加上你的密码对它们的担保；没有密码、没有私钥。会话 `vane sign setup '<JSON>'` 写登记记录、验担保 —— 验过，这几把当场是签字人。");
  }
  rows.forEach((r, i) => {
    r.b.disabled = i > 0;
    r.b.onclick = async () => {
      r.b.disabled = true; early.disabled = true;           // 正在设的这一把没好之前不收尾（免得它落在担保外面）
      r.st.textContent = "正在设 ……"; r.st.className = "pill busy";
      try {
        const reg = await createPasskey(r.n);
        const text = recordText(reg, rec);
        done.push({reg, sha: hex(await sha256(enc.encode(text))), file: "signers/" + slugOf(r.n) + "-" + reg.fingerprint.slice(0, 12) + ".json"});
        r.st.textContent = "设好了 · 钥 " + reg.fingerprint.slice(0, 16) + "…";
        r.st.className = "pill ok";
        r.b.remove();
        if (i + 1 < rows.length) { rows[i + 1].b.disabled = false; early.disabled = false; }
        else await finish();
      } catch (e) {
        if (!finished) { r.b.disabled = false; early.disabled = !done.length; r.st.textContent = "没设成"; r.st.className = "pill"; }
        fail(e, card2);
      }
    };
  });
  early.onclick = () => finish().catch(e => fail(e, card2));
}

// ---------------------------------------------------------------- 首页（没有链接时）
function how() {
  return h("div", {class: "how"},
    h("div", {}, h("b", {text: "① 会话给链接"}), "要你签什么，会话就给一个链接；内容全在链接 # 后面，不发给任何服务器。"),
    h("div", {}, h("b", {text: "② 看一眼"}), "建议的那几项已经替你勾好、选好；每一件的原文都摆着，签的就是这些字节。"),
    h("div", {}, h("b", {text: "③ 按一次"}), "Touch ID / Windows Hello / PIN / 安全钥。私钥在设备里，这一页拿不到。"));
}
function home(state, me) {
  document.title = "vane 签字";
  if (me) {
    const more = h("div", {});
    app.replaceChildren(hero("签字页", "这台设备可以签了",
      "不用再做什么：会话给的签字链接直接在这里打开，看一眼，按一次指纹 / PIN。签字页有新版本时，链接会把它带来，这一页验过根签字人的签名自己换上。"),
      h("section", {class: "card"},
        h("div", {class: "status-row"}, h("span", {class: "badge-ic"}, icon("check")),
          h("div", {}, h("h3", {text: "已登记：" + me.principal}), h("div", {class: "meta mono", text: "钥 " + String(me.fingerprint).slice(0, 16) + "… · " + (me.rpId || location.hostname)}))),
        h("div", {class: "btnrow"},
          h("button", {class: "btn ghost small", type: "button", onclick: () => { more.replaceChildren(); resultHost = more; showEnrolled(me, false); }}, "再看一次登记的那段 JSON"),
          h("button", {class: "btn ghost small", type: "button", onclick: () => { more.replaceChildren(); enrollForm(state, me, more); }}, "再登记一把（另一个人 / 另一把安全钥）"),
          h("button", {class: "btn ghost small", type: "button", onclick: () => { more.replaceChildren(); passwordForm(more, true); }}, "设一个密码（也能签）"))),
      more, how());
    return;
  }
  app.replaceChildren(hero("签字页", "登记这台设备，成为 vane 的签字人",
    "有 vane 的人都可以签；签 = 为你批准的东西负责。每台设备登记一次，以后只点会话给的链接。"));
  enrollForm(state, null, app);
  app.append(how());
}
function passwordForm(where, open) {                        // 2.6.0
  const who = h("input", {class: "input", placeholder: "你的名字（GitHub 用户名）", autocomplete: "username"});
  const pw = h("input", {class: "input", type: "password", placeholder: "签字密码", autocomplete: "new-password"});
  const again = h("input", {class: "input", type: "password", placeholder: "再输一次", autocomplete: "new-password"});
  const btn = h("button", {class: "btn ghost", type: "button"}, icon("lock"), h("span", {text: "用这个密码登记"}));
  const c = h("details", {class: "card", open: !!open}, h("summary", {}, icon("chev"), "设一个签字密码（和 passkey 一样能签；忘了 passkey 设备也还能签）"),
    h("p", {class: "muted", text: "密码在这一页里变成一把签名钥（scrypt + Ed25519），只交出公钥。贴回会话之后，用你的 passkey 担保一次，这把密码钥就是签字人。密码只有你自己输：" +
      "会话（AI）拿不到它，环境变量里的密码也不能签。至少 12 个字符，几个不相干的词最好。"}),
    h("label", {class: "field"}, h("span", {text: "名字"}), who), h("label", {class: "field"}, h("span", {text: "签字密码"}), pw),
    h("label", {class: "field"}, h("span", {text: "再输一次"}), again), h("div", {class: "btnrow"}, btn));
  btn.onclick = () => { btn.disabled = true; enrollPassword(who.value.trim(), pw.value, again.value, c).catch(e => { btn.disabled = false; fail(e, c); }); };
  (where || app).append(c);
}
function enrollForm(state, me, where) {
  const inp = h("input", {class: "input", placeholder: "你的名字（GitHub 用户名或你在团队里的名字）", autocomplete: "username"});
  const btn = h("button", {class: "btn primary", type: "button"}, icon("key"), h("span", {text: "登记这台设备的 passkey"}));
  const c = h("section", {class: "card"}, h("h3", {text: "登记这台设备的 passkey（每台设备一次）"}),
    h("p", {class: "muted", text: "写下名字、按这台设备的验证（Windows Hello PIN / 指纹 / Touch ID / USB 安全钥），会给出一段公钥和设备的证明（都不是秘密），贴回会话。" +
      "钥是用来挡住不稳定的 AI 的，不是用来挡人的：设备证明得了是硬件，当场就是签字人；证明不了，任一位签字人点一下确认你是人。"}),
    h("label", {class: "field"}, h("span", {text: "名字"}), inp), h("div", {class: "btnrow"}, btn));
  const run = () => { if (btn.disabled) return; btn.disabled = true; enroll(state, inp.value.trim(), me).catch(e => { btn.disabled = false; fail(e, c); }); };

}

// ---------------------------------------------------------------- 开页
document.getElementById("mark").append(icon("mark"));
window.addEventListener("hashchange", () => location.reload());   // 已开着的页上换链接（只变 # 后面）也重读（2026-10-21 用户「nothing happen」）
(async () => {
  const state = await loadState();
  STATE = state;
  const me = rememberedMe(state);
  chrome(state, me);
  if (!window.PublicKeyCredential) {                       // 2.12.0：用不了 passkey 的浏览器（例如某个 app 里面的浏览器）—— 说清楚，给复制链接
    app.replaceChildren(hero("用不了 passkey", "这个浏览器签不了字",
      "这一页要用这台设备的 passkey（Touch ID / Windows Hello / PIN / 安全钥）签，这个浏览器不支持。如果是在某个 app 里面的浏览器打开的，把链接复制到 Safari / Chrome / Edge 打开 —— 要签的内容全在链接里，一个字不变。"),
      h("div", {class: "btnrow"}, copyLinkButton()));
    return;
  }
  if (location.hostname !== "localhost" && !CLOUD_HOSTS.includes(location.hostname))
    return fail("要从 http://localhost:8765/（本机）或 https://mxx-yyl.github.io/signPage/（云端）打开（passkey 认的是这两处）");
  let payload = null;
  try { payload = await readPayload(); } catch (e) { return fail("链接读不动：" + e.message); }
  if (payload && payload.release) {
    const r = await considerRelease(state, payload.release, me);
    if (r.status === "install") {
      busy("签字页有新版本（箱 " + r.manifest.box + "），根签字人 " + r.by + " 签过 —— 正在换上…", banner);
      try { return await install(state, payload.release, payload.release.assertion, r.manifest); } catch (e) { fail(e, banner); }
    } else if (r.status === "needs-local") {
      const b = h("button", {class: "btn ghost small", type: "button"}, icon("key"), h("span", {text: "用我的 passkey 批准，换成新版"}));
      const nb = notice("warn", "签字页有新版本（箱 " + r.manifest.box + "）", h("div", {},
        h("p", {text: "这台电脑还不认任何根签字人（第一次装的时候名单是空的），所以由你自己决定要不要换：只在你知道 vane 刚登记了新的签字页时才换。不换也照样能签下面的东西。"}),
        h("div", {class: "btnrow"}, b)), banner);
      b.onclick = () => { b.disabled = true; approveLocally(state, payload.release, me, r.manifest).catch(e => { b.disabled = false; fail(e, nb); }); };
    } else if (r.status === "rejected") {
      notice("warn", "链接带来的签字页新版本没有换上", r.note + "。下面照样用这台电脑上现在这一页签。", banner);
    }
  }
  if (payload && payload.setup) return setupFlow(payload.setup, payload.pw);   // 2.10.0：一次密码设 passkey
  if (payload && (payload.items || []).length) return showItems(payload.items, me, payload.ret, payload.pw);
  if (payload && payload.release) return;
  home(state, me);
})().catch(e => fail(e));
